name: Build Android TV APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Folia-TV
        uses: actions/checkout@v4

      - name: Checkout folia-major (web)
        uses: actions/checkout@v4
        with:
          repository: chthollyphile/folia-major
          path: web

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build bundled Folia web
        run: node scripts/build-web-for-tv.mjs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (optional)
        if: ${{ secrets.FOLIA_TV_KEYSTORE_BASE64 != '' }}
        working-directory: android-tv
        env:
          FOLIA_TV_KEYSTORE_BASE64: ${{ secrets.FOLIA_TV_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$FOLIA_TV_KEYSTORE_BASE64" | base64 -d > keystore/folia-tv-release.jks

      - name: Build APK
        working-directory: android-tv
        env:
          FOLIA_TV_STORE_PASSWORD: ${{ secrets.FOLIA_TV_STORE_PASSWORD }}
          FOLIA_TV_KEY_ALIAS: ${{ secrets.FOLIA_TV_KEY_ALIAS }}
          FOLIA_TV_KEY_PASSWORD: ${{ secrets.FOLIA_TV_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -f keystore/folia-tv-release.jks ]; then
            ./gradlew :app:assembleRelease --no-daemon
          else
            ./gradlew :app:assembleDebug --no-daemon
          fi

      - name: Package artifact
        working-directory: android-tv
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VERSION="snapshot"; fi
          mkdir -p dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/Folia-TV-${VERSION}.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "dist/Folia-TV-${VERSION}-debug.apk"
          fi
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folia-TV-apk
          path: android-tv/dist/*.apk

      - name: Create / update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK=$(ls android-tv/dist/Folia-TV-*.apk | head -n 1)
          NOTES=$(cat <<EOF
          ## Folia-TV v${VERSION}

          Android TV 客户端：内置 Folia 界面，只需配置音源 API。

          ### 安装
          1. 下载下方 APK
          2. 侧载到 Android TV（\`adb install -r Folia-TV-*.apk\`）
          3. 首次打开填写网易云 / QQ / 酷狗 API 地址（模拟器用 \`http://10.0.2.2:3300\`）

          上游：[chthollyphile/folia-major](https://github.com/chthollyphile/folia-major)
          EOF
          )
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Folia-TV v${VERSION}" \
              --notes "$NOTES"
          fi
