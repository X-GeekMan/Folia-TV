<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Folia TV</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1a14;
      --fg: #e8fff2;
      --accent: #7cffb2;
      --muted: #8fb5a2;
      --panel: #13261e;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, #163528, var(--bg));
      color: var(--fg);
    }
    main {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 48px;
    }
    .card {
      width: min(920px, 100%);
      background: color-mix(in srgb, var(--panel) 88%, black);
      border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-radius: 20px;
      padding: 40px 44px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 42px;
      letter-spacing: 0.04em;
      font-weight: 650;
    }
    p { margin: 0 0 28px; color: var(--muted); font-size: 20px; line-height: 1.5; }
    label { display: block; font-size: 16px; color: var(--muted); margin-bottom: 10px; }
    input {
      width: 100%;
      font-size: 22px;
      padding: 18px 20px;
      border-radius: 12px;
      border: 2px solid transparent;
      background: #0a1511;
      color: var(--fg);
      outline: none;
    }
    input:focus, button:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 6px rgba(124,255,178,0.2);
    }
    .row {
      display: flex;
      gap: 16px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    button {
      font-size: 20px;
      padding: 16px 28px;
      border-radius: 12px;
      border: 0;
      background: var(--accent);
      color: #062016;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      color: var(--fg);
      border: 2px solid color-mix(in srgb, var(--accent) 45%, transparent);
    }
    .hints {
      margin-top: 28px;
      display: grid;
      gap: 10px;
      font-size: 16px;
      color: var(--muted);
    }
    .hints code {
      color: var(--accent);
      font-family: ui-monospace, Consolas, monospace;
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Folia TV</h1>
      <p>输入已部署的 Folia Web 地址（与桌面/Web 同一套后端 API）。遥控器方向键移动焦点，确认键打开。</p>
      <label for="url">Folia Web URL</label>
      <input id="url" type="url" spellcheck="false"
        placeholder="https://your-folia.example.com 或 http://192.168.1.10:3000"
        value="" />
      <div class="row">
        <button id="go" data-tv-focusable="true">打开 Folia</button>
        <button id="local" class="secondary" data-tv-focusable="true">模拟器本机 :3000</button>
      </div>
      <div class="hints">
        <div>开发：电脑跑 <code>npm run dev</code>，TV/模拟器填局域网 IP。</div>
        <div>Android 模拟器访问宿主：<code>http://10.0.2.2:3000</code></div>
        <div>也可在安装后用 Intent extra <code>start_url</code> 直接指定地址。</div>
      </div>
    </section>
  </main>
  <script>
    (function () {
      var input = document.getElementById("url");
      var saved = "";
      try { saved = localStorage.getItem("foliatv.startUrl") || ""; } catch (_) {}
      if (saved) input.value = saved;

      function openUrl(url) {
        if (!url) return;
        try { localStorage.setItem("foliatv.startUrl", url); } catch (_) {}
        window.location.href = url;
      }

      document.getElementById("go").addEventListener("click", function () {
        openUrl((input.value || "").trim());
      });
      document.getElementById("local").addEventListener("click", function () {
        input.value = "http://10.0.2.2:3000";
        openUrl(input.value);
      });
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") openUrl((input.value || "").trim());
      });
    })();
  </script>
</body>
</html>
